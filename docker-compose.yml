# ============================================================
# CodeNova 智码星 —— Docker Compose 开发环境
# 使用：docker compose up -d
# ============================================================

name: codenova

services:
  # ---------- PostgreSQL 关系数据库 ----------
  postgres:
    image: postgres:16-alpine
    container_name: codenova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codenova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codenova_dev_2026}
      POSTGRES_DB: ${POSTGRES_DB:-codenova}
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codenova} -d ${POSTGRES_DB:-codenova}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - codenova-net

  # ---------- Redis（Celery Broker / 缓存） ----------
  redis:
    image: redis:7-alpine
    container_name: codenova-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - codenova-net

  # ---------- Qdrant 向量数据库 ----------
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: codenova-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6333/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - codenova-net

  # ---------- MinIO 对象存储 ----------
  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: codenova-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 控制台
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - codenova-net

  # ---------- 后端 FastAPI ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codenova-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - repo_cache:/tmp/codenova_repos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      sh -c "python -m app.bootstrap &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - codenova-net

  # ---------- 前端 Vite + React ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codenova-frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - codenova-net

# ---------- Celery Worker（异步任务执行） ----------
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codenova-celery-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
    volumes:
      - ./backend:/app
      - repo_cache:/tmp/codenova_repos
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    networks:
      - codenova-net
